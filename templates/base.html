<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        David ShopNova
        {% endblock %}
    </title>


    <!-- Bootstrap -->
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">


    <!-- CSS propio de Flask -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="{{ url_for('inicio') }}">
            🛒 David ShopNova
        </a>


        <div class="d-flex gap-2">


            <a class="btn btn-primary" href="{{ url_for('productos') }}">
                Productos
            </a>


            <a class="btn btn-primary" href="{{ url_for('clientes') }}">
                Clientes
            </a>


            <a class="btn btn-primary" href="{{ url_for('proveedores') }}">
                Proveedores
            </a>


            <a class="btn btn-primary" href="{{ url_for('facturacion') }}">
                Facturación
            </a>


        </div>


    </div>


</nav>




<!-- CONTENIDO DINÁMICO -->

<main class="container mt-5">


    {% block content %}

    {% endblock %}


</main>




<!-- JavaScript propio de Flask -->

<script src="{{ url_for('static', filename='js/script.js') }}"></script>


</body>

</html>
